<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABUJI Cart</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body.dark { background-color: #0b0518; color: white; }
        .glass-panel { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .item-card { background: #150b2e; border-radius: 12px; padding: 15px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #3333ff; }
    </style>
</head>
<body class="dark font-sans pb-32 p-4">

    <!-- معلومات العميل الحقيقية الممررة من البوت -->
    <div class="glass-panel p-4 rounded-xl mb-6 flex justify-between items-center">
        <div>
            <p id="bal-label" class="text-xs text-gray-400">الرصيد المتاح:</p>
            <p id="live-balance" class="text-xl font-bold text-green-400">0.00 USDT</p>
        </div>
        <div class="bg-blue-600 px-3 py-1 rounded-full text-xs font-bold" id="lang-indicator">AR</div>
    </div>

    <!-- المنتجات المتعددة في السلة -->
    <div class="item-card shadow-lg">
        <div>
            <h2 class="text-lg font-bold">iPhone Plus </h2>
            <p class="text-sm text-gray-300" id="p-iphone">6.00 USDT</p>
        </div>
        <div class="flex items-center space-x-3 rtl:space-x-reverse">
            <button onclick="updateCart('iphone', -1)" class="bg-red-500 w-8 h-8 rounded-full font-bold">-</button>
            <span id="qty-iphone" class="font-bold text-lg w-4 text-center">0</span>
            <button onclick="updateCart('iphone', 1)" class="bg-green-500 w-8 h-8 rounded-full font-bold">+</button>
        </div>
    </div>

    <div class="item-card shadow-lg">
        <div>
            <h2 class="text-lg font-bold">iPad Plus 📱</h2>
            <p class="text-sm text-gray-300" id="p-ipad">4.00 USDT</p>
        </div>
        <div class="flex items-center space-x-3 rtl:space-x-reverse">
            <button onclick="updateCart('ipad', -1)" class="bg-red-500 w-8 h-8 rounded-full font-bold">-</button>
            <span id="qty-ipad" class="font-bold text-lg w-4 text-center">0</span>
            <button onclick="updateCart('ipad', 1)" class="bg-green-500 w-8 h-8 rounded-full font-bold">+</button>
        </div>
    </div>

    <div class="item-card shadow-lg">
        <div>
            <h2 class="text-lg font-bold">Android Plus 🤖</h2>
            <p class="text-sm text-gray-300" id="p-android">4.50 USDT</p>
        </div>
        <div class="flex items-center space-x-3 rtl:space-x-reverse">
            <button onclick="updateCart('android', -1)" class="bg-red-500 w-8 h-8 rounded-full font-bold">-</button>
            <span id="qty-android" class="font-bold text-lg w-4 text-center">0</span>
            <button onclick="updateCart('android', 1)" class="bg-green-500 w-8 h-8 rounded-full font-bold">+</button>
        </div>
    </div>

    <!-- شريط الدفع والخصم -->
    <div class="fixed bottom-0 left-0 right-0 glass-panel p-4 rounded-t-2xl z-50 bg-[#0b0518]">
        <div class="flex justify-between items-center mb-2">
            <span class="font-bold" id="total-text">إجمالي السلة:</span>
            <div class="text-left">
                <span id="totalPrice" class="font-bold text-2xl text-green-400">0.00 USDT</span>
                <p id="discountLabel" class="text-xs text-pink-400 font-bold hidden">تم تطبيق خصم 5%!</p>
            </div>
        </div>
        <button id="checkoutBtn" onclick="checkout()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl opacity-50 cursor-not-allowed" disabled>إتمام الدفع</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const urlParams = new URLSearchParams(window.location.search);
        const currentBalance = parseFloat(urlParams.get('bal')) || 0;
        const lang = urlParams.get('lang') || 'ar';
        
        document.getElementById('live-balance').innerText = `${currentBalance.toFixed(2)} USDT`;
        document.getElementById('lang-indicator').innerText = lang.toUpperCase();

        if(lang === 'en') {
            document.documentElement.dir = 'ltr';
            document.getElementById('bal-label').innerText = "Available Balance:";
            document.getElementById('total-text').innerText = "Cart Total:";
            document.getElementById('checkoutBtn').innerText = "Checkout";
            document.getElementById('discountLabel').innerText = "5% Discount Applied!";
        }

        let cart = { iphone: 0, ipad: 0, android: 0 };
        const prices = { iphone: 6.0, ipad: 4.0, android: 4.5 };

        function updateCart(item, change) {
            if (cart[item] + change >= 0) {
                cart[item] += change;
                document.getElementById(`qty-${item}`).innerText = cart[item];
                calculateTotal();
            }
        }

        function calculateTotal() {
            let totalQty = cart.iphone + cart.ipad + cart.android;
            
            // تطبيق خصم 5% حصراً إذا كانت الكمية أكبر من 5
            let discountPercent = totalQty > 5 ? 0.05 : 0.0;
            
            let finalTotal = 0.0;
            for (let item in cart) {
                finalTotal += (prices[item] * (1 - discountPercent) * cart[item]);
            }

            document.getElementById('totalPrice').innerText = `${finalTotal.toFixed(2)} USDT`;
            
            const btn = document.getElementById('checkoutBtn');
            const discLabel = document.getElementById('discountLabel');

            if (totalQty > 0) {
                btn.disabled = false;
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
                if(discountPercent > 0) discLabel.classList.remove('hidden');
                else discLabel.classList.add('hidden');
            } else {
                btn.disabled = true;
                btn.classList.add('opacity-50', 'cursor-not-allowed');
                discLabel.classList.add('hidden');
            }
        }

        function checkout() {
            let totalQty = cart.iphone + cart.ipad + cart.android;
            if (totalQty === 0) return;
            tg.sendData(JSON.stringify({ cart: cart, totalItems: totalQty }));
            tg.close();
        }
    </script>
</body>
</html>
