<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SFA PLUS Store</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --card-bg: #f5f5f5;
            --btn-bg: #0088cc;
            --btn-text: #ffffff;
        }
        body.dark-theme {
            --bg-color: #1a1a1a;
            --text-color: #ffffff;
            --card-bg: #2d2d2d;
            --btn-bg: #1da1f2;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: Arial, sans-serif;
            margin: 0; padding: 15px;
            transition: 0.3s;
        }
        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding-bottom: 15px; border-bottom: 1px solid #ccc; margin-bottom: 20px;
        }
        .controls span {
            cursor: pointer; padding: 5px 10px; background: var(--card-bg);
            border-radius: 5px; margin-left: 5px; font-weight: bold;
        }
        .wallet-info { text-align: center; margin-bottom: 20px; font-size: 18px; font-weight: bold; }
        .product {
            background-color: var(--card-bg); padding: 15px; margin-bottom: 15px;
            border-radius: 10px; display: flex; justify-content: space-between; align-items: center;
        }
        .product-info h3 { margin: 0 0 5px 0; font-size: 16px; }
        .stock-badge { font-size: 12px; color: #ff9800; }
        .qty-controls { display: flex; align-items: center; gap: 10px; }
        .qty-controls button {
            background: var(--btn-bg); color: var(--btn-text);
            border: none; border-radius: 50%; width: 30px; height: 30px; font-size: 18px; cursor: pointer;
        }
        .cart-summary {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: var(--card-bg); padding: 15px; box-sizing: border-box;
            border-top: 2px solid var(--btn-bg); display: flex; justify-content: space-between; align-items: center;
        }
        .checkout-btn {
            background: var(--btn-bg); color: var(--btn-text);
            padding: 10px 20px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2 style="margin: 0;">SFA PLUS</h2>
        <div class="controls">
            <span id="themeToggle" onclick="toggleTheme()">☀️ Dark</span>
            <span id="langToggle" onclick="toggleLang()">English</span>
        </div>
    </div>

    <div class="wallet-info">
        <span class="lang-text" data-ar="رصيدك:" data-en="Balance:">رصيدك:</span> <span id="userBalance">0.00</span> $
    </div>

    <div id="products-container">
        <div class="product">
            <div class="product-info">
                <h3>iPhone plus</h3>
                <span class="lang-text" data-ar="السعر: 6.00 $" data-en="Price: 6.00 $">السعر: 6.00 $</span><br>
                <span class="stock-badge lang-text" data-ar="متوفر:" data-en="Stock:">متوفر:</span> <span id="stk_iphone">0</span>
            </div>
            <div class="qty-controls">
                <button onclick="updateQty('iphone', -1)">-</button>
                <span id="qty_iphone">0</span>
                <button onclick="updateQty('iphone', 1)">+</button>
            </div>
        </div>
        <div class="product">
            <div class="product-info">
                <h3>iPad plus apple</h3>
                <span class="lang-text" data-ar="السعر: 4.00 $" data-en="Price: 4.00 $">السعر: 4.00 $</span><br>
                <span class="stock-badge lang-text" data-ar="متوفر:" data-en="Stock:">متوفر:</span> <span id="stk_ipad">0</span>
            </div>
            <div class="qty-controls">
                <button onclick="updateQty('ipad', -1)">-</button>
                <span id="qty_ipad">0</span>
                <button onclick="updateQty('ipad', 1)">+</button>
            </div>
        </div>
        <div class="product">
            <div class="product-info">
                <h3>Android plus</h3>
                <span class="lang-text" data-ar="السعر: 4.50 $" data-en="Price: 4.50 $">السعر: 4.50 $</span><br>
                <span class="stock-badge lang-text" data-ar="متوفر:" data-en="Stock:">متوفر:</span> <span id="stk_android">0</span>
            </div>
            <div class="qty-controls">
                <button onclick="updateQty('android', -1)">-</button>
                <span id="qty_android">0</span>
                <button onclick="updateQty('android', 1)">+</button>
            </div>
        </div>
        <div class="product">
            <div class="product-info">
                <h3>Snapchat plus</h3>
                <span class="lang-text" data-ar="السعر: 3.50 $" data-en="Price: 3.50 $">السعر: 3.50 $</span><br>
                <span class="stock-badge lang-text" data-ar="متوفر:" data-en="Stock:">متوفر:</span> <span id="stk_snapchat">0</span>
            </div>
            <div class="qty-controls">
                <button onclick="updateQty('snapchat', -1)">-</button>
                <span id="qty_snapchat">0</span>
                <button onclick="updateQty('snapchat', 1)">+</button>
            </div>
        </div>
    </div>

    <div style="height: 80px;"></div> <div class="cart-summary">
        <div>
            <b class="lang-text" data-ar="الإجمالي:" data-en="Total:">الإجمالي:</b> <span id="totalPrice">0.00</span> $
        </div>
        <button class="checkout-btn lang-text" data-ar="إتمام الشراء 🛒" data-en="Checkout 🛒" onclick="checkout()">إتمام الشراء 🛒</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let currentLang = 'ar';
        const prices = { iphone: 6.0, ipad: 4.0, android: 4.5, snapchat: 3.5 };
        const cart = { iphone: 0, ipad: 0, android: 0, snapchat: 0 };
        const stock = { iphone: 0, ipad: 0, android: 0, snapchat: 0 };

        // قراءة البيانات المرسلة من البوت
        const urlParams = new URLSearchParams(window.location.search);
        document.getElementById('userBalance').innerText = urlParams.get('bal') || '0.00';
        
        stock.iphone = parseInt(urlParams.get('stk_iph')) || 0;
        stock.ipad = parseInt(urlParams.get('stk_ipa')) || 0;
        stock.android = parseInt(urlParams.get('stk_and')) || 0;
        stock.snapchat = parseInt(urlParams.get('stk_snp')) || 0;

        document.getElementById('stk_iphone').innerText = stock.iphone;
        document.getElementById('stk_ipad').innerText = stock.ipad;
        document.getElementById('stk_android').innerText = stock.android;
        document.getElementById('stk_snapchat').innerText = stock.snapchat;

        function updateQty(item, change) {
            let newQty = cart[item] + change;
            if (newQty >= 0 && newQty <= stock[item]) {
                cart[item] = newQty;
                document.getElementById('qty_' + item).innerText = cart[item];
                calculateTotal();
            }
        }

        function calculateTotal() {
            let total = 0;
            for (let item in cart) { total += cart[item] * prices[item]; }
            document.getElementById('totalPrice').innerText = total.toFixed(2);
        }

        function checkout() {
            let totalQty = cart.iphone + cart.ipad + cart.android + cart.snapchat;
            if (totalQty === 0) {
                tg.showAlert(currentLang === 'ar' ? "السلة فارغة!" : "Cart is empty!");
                return;
            }
            tg.sendData(JSON.stringify({ cart: cart }));
            tg.close();
        }

        function toggleTheme() {
            document.body.classList.toggle('dark-theme');
            let isDark = document.body.classList.contains('dark-theme');
            document.getElementById('themeToggle').innerText = isDark ? "🌙 Light" : "☀️ Dark";
        }

        function toggleLang() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            document.getElementById('langToggle').innerText = currentLang === 'ar' ? 'English' : 'العربية';
            document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            
            document.querySelectorAll('.lang-text').forEach(el => {
                el.innerText = el.getAttribute('data-' + currentLang);
            });
        }
    </script>
</body>
</html>
