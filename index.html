<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SFA PLUS App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0a0210;
            --panel-bg: rgba(22, 5, 38, 0.8);
            --primary: #9333ea;
            --accent: #d946ef;
            --text-main: #f3f4f6;
            --text-muted: #a78bfa;
            --danger: #ef4444;
            --success: #10b981;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { background-color: var(--bg-base); color: var(--text-main); padding-bottom: 80px; overflow-x: hidden; }

        /* شريط علوي */
        .header {
            position: sticky; top: 0; z-index: 50; background: rgba(10, 2, 16, 0.9); backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(147, 51, 234, 0.3); display: flex; justify-content: space-between; align-items: center; padding: 15px 20px;
        }
        .logo-text { font-size: 22px; font-weight: 900; background: linear-gradient(90deg, var(--accent), var(--primary)); -webkit-background-clip: text; color: transparent; letter-spacing: 1px; }

        /* إدارة الصفحات (Tabs) */
        .page { display: none; padding: 15px; animation: fadeIn 0.3s ease; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* كروت المنتجات */
        .product-card {
            background: var(--panel-bg); border-radius: 16px; padding: 15px; margin-bottom: 15px;
            border: 1px solid rgba(147, 51, 234, 0.2); display: flex; justify-content: space-between; align-items: center;
        }
        .prod-info h3 { font-size: 16px; margin-bottom: 5px; }
        .prod-info p { font-size: 14px; color: var(--text-muted); font-weight: bold; }
        .add-btn { background: var(--primary); border: none; color: white; padding: 8px 15px; border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .add-btn:active { transform: scale(0.95); }

        /* صفحة السلة */
        .cart-item { background: var(--panel-bg); border-radius: 12px; padding: 15px; margin-bottom: 10px; border: 1px solid rgba(147, 51, 234, 0.1); display: flex; justify-content: space-between; align-items: center; }
        .qty-controls { display: flex; align-items: center; gap: 10px; background: rgba(0,0,0,0.3); padding: 5px; border-radius: 20px; }
        .qty-btn { background: transparent; border: none; color: white; width: 25px; height: 25px; font-size: 16px; cursor: pointer; }
        
        .receipt-card { background: linear-gradient(145deg, rgba(22,5,38,1), rgba(10,2,16,1)); border-radius: 16px; padding: 20px; border: 1px solid var(--primary); margin-top: 20px; }
        .receipt-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; }
        .receipt-row.total { font-size: 20px; font-weight: bold; color: var(--accent); margin-top: 15px; border-top: 1px dashed rgba(255,255,255,0.2); padding-top: 15px; }
        .strike { text-decoration: line-through; color: var(--danger); font-size: 14px; margin-right: 10px; }
        
        .checkout-btn { width: 100%; padding: 15px; border-radius: 12px; border: none; background: linear-gradient(90deg, var(--primary), var(--accent)); color: white; font-size: 18px; font-weight: bold; margin-top: 20px; cursor: pointer; }
        .checkout-btn:disabled { background: #333; color: #777; cursor: not-allowed; }

        /* صفحة الحساب */
        .profile-header { text-align: center; margin-bottom: 30px; }
        .avatar { width: 80px; height: 80px; background: var(--primary); border-radius: 50%; display: inline-flex; justify-content: center; align-items: center; font-size: 30px; border: 3px solid var(--accent); margin-bottom: 10px; }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .stat-card { background: var(--panel-bg); padding: 20px; border-radius: 16px; text-align: center; border: 1px solid rgba(147, 51, 234, 0.2); }
        .stat-card h4 { color: var(--text-muted); font-size: 14px; margin-bottom: 5px; }
        .stat-card .value { font-size: 24px; font-weight: bold; color: #fff; }

        /* شريط التنقل السفلي */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; background: rgba(10, 2, 16, 0.95); backdrop-filter: blur(15px);
            border-top: 1px solid rgba(147, 51, 234, 0.4); display: flex; justify-content: space-around; padding: 10px 0; z-index: 100; padding-bottom: calc(10px + env(safe-area-inset-bottom));
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); text-decoration: none; font-size: 12px; cursor: pointer; transition: 0.2s; position: relative; }
        .nav-item i { font-size: 20px; margin-bottom: 4px; }
        .nav-item.active { color: var(--accent); }
        .badge { position: absolute; top: -5px; right: -10px; background: var(--danger); color: white; font-size: 10px; padding: 2px 6px; border-radius: 10px; font-weight: bold; display: none; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo-text">SFA PLUS</div>
        <button id="langToggle" style="background:transparent; border:1px solid var(--primary); color:white; padding:5px 15px; border-radius:20px;">English</button>
    </div>

    <!-- 1. صفحة المنتجات -->
    <div id="page-store" class="page active">
        <h2 style="margin-bottom: 15px; font-size: 18px;">المتجر (Store)</h2>
        <div id="products-list"></div>
    </div>

    <!-- 2. صفحة السلة -->
    <div id="page-cart" class="page">
        <h2 style="margin-bottom: 15px; font-size: 18px;">سلة المشتريات (Cart)</h2>
        <div id="cart-empty" style="text-align: center; color: var(--text-muted); margin-top: 50px;">
            <i class="fa-solid fa-cart-arrow-down" style="font-size: 40px; margin-bottom: 10px;"></i>
            <p>السلة فارغة حالياً</p>
        </div>
        <div id="cart-content" style="display: none;">
            <div id="cart-items-list"></div>
            
            <div class="receipt-card">
                <div class="receipt-row"><span>المجموع الفرعي:</span> <span id="subtotal">0.00$</span></div>
                <div class="receipt-row" id="discount-row" style="color: var(--success); display: none;">
                    <span>الخصم المطبق:</span> <span id="discount-amount">-0.00$</span>
                </div>
                <div class="receipt-row total">
                    <span>الإجمالي النهائي:</span> 
                    <div>
                        <span id="old-price" class="strike" style="display:none;"></span>
                        <span id="final-total">0.00$</span>
                    </div>
                </div>
            </div>
            
            <button id="checkout-btn" class="checkout-btn" onclick="processCheckout()">إتمام الشراء والدفع</button>
        </div>
    </div>

    <!-- 3. صفحة الحساب (لوحة المستخدم) -->
    <div id="page-profile" class="page">
        <div class="profile-header">
            <div class="avatar"><i class="fa-solid fa-user-astronaut"></i></div>
            <h2 id="user-name">Client</h2>
            <p style="color: var(--success); font-size: 14px;"><i class="fa-solid fa-circle-check"></i> حساب موثق</p>
        </div>

        <div class="stat-grid">
            <div class="stat-card">
                <h4>الرصيد المتاح</h4>
                <div class="value" style="color: var(--success);"><span id="wallet-balance">0.00</span>$</div>
            </div>
            <div class="stat-card">
                <h4>إجمالي المشتريات</h4>
                <div class="value" id="total-orders">0</div>
            </div>
            <div class="stat-card" style="grid-column: span 2;">
                <h4>المبلغ المصروف كلياً</h4>
                <div class="value"><span id="total-spent">0.00</span>$</div>
            </div>
        </div>
    </div>

    <!-- شريط التنقل السفلي -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('store')">
            <i class="fa-solid fa-store"></i>
            <span>المنتجات</span>
        </div>
        <div class="nav-item" onclick="switchTab('cart')">
            <i class="fa-solid fa-cart-shopping"></i>
            <div class="badge" id="cart-badge">0</div>
            <span>السلة</span>
        </div>
        <div class="nav-item" onclick="switchTab('profile')">
            <i class="fa-solid fa-user"></i>
            <span>حسابي</span>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // 1. استخراج بيانات المستخدم الحقيقية من التيليجرام ومن الرابط (URL Params)
        const user = tg.initDataUnsafe?.user;
        if (user) document.getElementById('user-name').innerText = user.first_name;

        // لقراءة الرصيد والمصروفات من البوت (سنعدل البوت لاحقاً ليرسلها في الرابط)
        const urlParams = new URLSearchParams(window.location.search);
        document.getElementById('wallet-balance').innerText = urlParams.get('bal') || "0.00";
        document.getElementById('total-spent').innerText = urlParams.get('spent') || "0.00";
        document.getElementById('total-orders').innerText = urlParams.get('orders') || "0";

        // المنتجات والأسعار
        const products = {
            iphone: { id: 'iphone', name: 'iPhone Plus', icon: 'fa-apple', price: 6.0, min: 4.5 },
            ipad: { id: 'ipad', name: 'iPad Plus', icon: 'fa-tablet-screen-button', price: 4.0, min: 3.0 },
            android: { id: 'android', name: 'Android Plus', icon: 'fa-android', price: 4.5, min: 3.0 },
            snapchat: { id: 'snapchat', name: 'Snapchat Plus', icon: 'fa-ghost', price: 3.5, min: 2.5 }
        };

        let cart = {};

        // عرض المنتجات في الواجهة
        function renderStore() {
            const list = document.getElementById('products-list');
            list.innerHTML = '';
            for(let key in products) {
                const p = products[key];
                list.innerHTML += `
                    <div class="product-card">
                        <div class="prod-info">
                            <h3><i class="fa-brands ${p.icon}" style="color: var(--accent);"></i> ${p.name}</h3>
                            <p>${p.price}$</p>
                        </div>
                        <button class="add-btn" onclick="addToCart('${p.id}')"><i class="fa-solid fa-plus"></i> إضافة للسلة</button>
                    </div>
                `;
            }
        }

        // إضافة للسلة
        function addToCart(id) {
            if(!cart[id]) cart[id] = 0;
            cart[id]++;
            updateCartUI();
            tg.HapticFeedback.impactOccurred('light');
        }

        // تعديل الكمية من داخل السلة
        function changeQty(id, delta) {
            if(cart[id]) {
                cart[id] += delta;
                if(cart[id] <= 0) delete cart[id];
                updateCartUI();
                tg.HapticFeedback.impactOccurred('light');
            }
        }

        // تحديث واجهة السلة وحساب الخصم
        function updateCartUI() {
            const list = document.getElementById('cart-items-list');
            const emptyState = document.getElementById('cart-empty');
            const contentState = document.getElementById('cart-content');
            
            let totalItems = 0;
            let subtotal = 0;
            list.innerHTML = '';

            for(let id in cart) {
                const qty = cart[id];
                const p = products[id];
                totalItems += qty;
                subtotal += (p.price * qty);

                list.innerHTML += `
                    <div class="cart-item">
                        <div>
                            <div style="font-weight:bold;">${p.name}</div>
                            <div style="font-size:12px; color:var(--text-muted);">${p.price}$ للقطعة</div>
                        </div>
                        <div class="qty-controls">
                            <button class="qty-btn" onclick="changeQty('${id}', -1)"><i class="fa-solid fa-minus"></i></button>
                            <span style="font-weight:bold; width:20px; text-align:center;">${qty}</span>
                            <button class="qty-btn" onclick="changeQty('${id}', 1)"><i class="fa-solid fa-plus"></i></button>
                        </div>
                    </div>
                `;
            }

            // تحديث البادج السفلي
            const badge = document.getElementById('cart-badge');
            if(totalItems > 0) {
                badge.innerText = totalItems;
                badge.style.display = 'block';
                emptyState.style.display = 'none';
                contentState.style.display = 'block';
            } else {
                badge.style.display = 'none';
                emptyState.style.display = 'block';
                contentState.style.display = 'none';
            }

            // حساب الخصومات الاحترافية
            let discountPercent = 0;
            if (totalItems >= 10) discountPercent = 0.25;
            else if (totalItems >= 5) discountPercent = 0.10;

            let finalTotal = 0;
            for(let id in cart) {
                let p = products[id];
                let calcPrice = p.price * (1 - discountPercent);
                if (calcPrice < p.min) calcPrice = p.min; // حماية الحد الأدنى للسعر
                finalTotal += (calcPrice * cart[id]);
            }

            const discountAmount = subtotal - finalTotal;

            document.getElementById('subtotal').innerText = subtotal.toFixed(2) + "$";
            
            const discRow = document.getElementById('discount-row');
            const oldPrice = document.getElementById('old-price');
            
            if(discountAmount > 0) {
                discRow.style.display = 'flex';
                document.getElementById('discount-amount').innerText = "-" + discountAmount.toFixed(2) + "$";
                oldPrice.style.display = 'inline-block';
                oldPrice.innerText = subtotal.toFixed(2) + "$";
            } else {
                discRow.style.display = 'none';
                oldPrice.style.display = 'none';
            }

            document.getElementById('final-total').innerText = finalTotal.toFixed(2) + "$";
            
            const currentWallet = parseFloat(document.getElementById('wallet-balance').innerText);
            const checkoutBtn = document.getElementById('checkout-btn');
            
            if(finalTotal > currentWallet && currentWallet > 0) {
                checkoutBtn.innerText = "رصيد المحفظة غير كافٍ";
                checkoutBtn.disabled = true;
            } else {
                checkoutBtn.innerText = "إتمام الشراء والدفع";
                checkoutBtn.disabled = false;
            }
        }

        // نظام التنقل بين الصفحات (Tabs)
        function switchTab(tabId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            document.getElementById(`page-${tabId}`).classList.add('active');
            event.currentTarget.classList.add('active');
            window.scrollTo(0,0);
        }

        // الإرسال للبوت
        function processCheckout() {
            if(Object.keys(cart).length === 0) return;
            tg.sendData(JSON.stringify({ cart: cart }));
        }

        renderStore();
    </script>
</body>
</html>
