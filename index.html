<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SFA Enterprise Store</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0a0210; /* بنفسجي داكن جداً يميل للسواد */
            --panel-bg: rgba(22, 5, 38, 0.6);
            --primary: #7e22ce;
            --accent: #d946ef;
            --text-main: #f3f4f6;
            --text-muted: #a78bfa;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            padding-bottom: 100px;
            overflow-x: hidden;
        }

        /* تأثير الإضاءة الفخم والبطيء */
        .ambient-glow {
            position: fixed; top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle at 50% 50%, rgba(126, 34, 206, 0.15), transparent 60%);
            z-index: -1; pointer-events: none;
            animation: pulse-glow 15s ease-in-out infinite alternate;
        }
        @keyframes pulse-glow { 0% { transform: scale(0.9); opacity: 0.5; } 100% { transform: scale(1.1); opacity: 1; } }

        /* شريط علوي زجاجي */
        .header {
            position: sticky; top: 0; z-index: 50;
            background: rgba(10, 2, 16, 0.8); backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(126, 34, 206, 0.3);
            display: flex; justify-content: space-between; align-items: center; padding: 15px 20px;
        }
        
        .logo-text { font-size: 22px; font-weight: 900; background: linear-gradient(90deg, #d946ef, #7e22ce); -webkit-background-clip: text; color: transparent; letter-spacing: 1px; }
        .lang-btn { background: transparent; border: 1px solid var(--primary); color: var(--text-main); padding: 5px 12px; border-radius: 20px; font-size: 12px; cursor: pointer; transition: 0.3s;}
        
        /* بيانات المستخدم */
        .user-profile {
            margin: 20px; padding: 15px; border-radius: 16px;
            background: var(--panel-bg); border: 1px solid rgba(126, 34, 206, 0.2);
            display: flex; align-items: center; gap: 15px;
        }
        .user-avatar { width: 50px; height: 50px; border-radius: 50%; background: var(--primary); display: flex; justify-content: center; align-items: center; font-size: 20px; border: 2px solid var(--accent); }
        .user-info h3 { font-size: 16px; margin-bottom: 3px; }
        .user-info p { font-size: 12px; color: var(--text-muted); }

        /* كروت المنتجات */
        .product-card {
            background: var(--panel-bg); border-radius: 16px; padding: 18px; margin: 0 20px 15px 20px;
            border: 1px solid rgba(126, 34, 206, 0.15); box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            display: flex; justify-content: space-between; align-items: center;
            position: relative; overflow: hidden;
        }
        .product-card::before {
            content: ''; position: absolute; left: 0; top: 0; width: 4px; height: 100%;
            background: linear-gradient(to bottom, var(--accent), var(--primary));
        }
        .prod-details h2 { font-size: 18px; font-weight: bold; margin-bottom: 5px; }
        .prod-details p { font-size: 14px; color: var(--text-muted); font-weight: 500; }
        
        .controls { display: flex; align-items: center; gap: 12px; background: rgba(0,0,0,0.3); padding: 5px; border-radius: 30px; }
        .btn-ctrl { background: var(--primary); border: none; color: white; width: 30px; height: 30px; border-radius: 50%; font-size: 16px; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: 0.2s;}
        .btn-ctrl:active { transform: scale(0.9); }
        .btn-ctrl.minus { background: rgba(255, 255, 255, 0.1); }
        .qty { font-size: 16px; font-weight: bold; width: 20px; text-align: center; }

        /* شريط السلة السفلي */
        .cart-panel {
            position: fixed; bottom: 0; left: 0; right: 0; padding: 15px 20px 25px 20px;
            background: rgba(10, 2, 16, 0.95); backdrop-filter: blur(20px);
            border-top: 1px solid rgba(126, 34, 206, 0.4); box-shadow: 0 -10px 30px rgba(0,0,0,0.8);
            z-index: 100;
        }
        .cart-summary { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 15px; }
        .total-label { font-size: 14px; color: var(--text-muted); }
        .total-price { font-size: 26px; font-weight: 900; color: #fff; text-shadow: 0 0 10px rgba(217, 70, 239, 0.5); }
        .discount-badge { display: inline-block; background: rgba(217, 70, 239, 0.2); color: var(--accent); padding: 3px 8px; border-radius: 8px; font-size: 11px; font-weight: bold; margin-top: 5px; border: 1px solid rgba(217, 70, 239, 0.3); display: none;}
        
        .checkout-btn {
            width: 100%; padding: 14px; border-radius: 12px; border: none;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            color: white; font-size: 16px; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 15px rgba(126, 34, 206, 0.4); opacity: 0.5; pointer-events: none; transition: 0.3s;
        }
        .checkout-btn.active { opacity: 1; pointer-events: auto; }

        .support-link { display: block; text-align: center; margin: 15px 0 25px 0; color: var(--text-muted); text-decoration: none; font-size: 13px; }
        .support-link i { margin-right: 5px; color: var(--accent); }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>

    <div class="header">
        <div class="logo-text">SFA PLUS</div>
        <button class="lang-btn" id="langBtn" onclick="toggleLang()">English</button>
    </div>

    <div class="user-profile">
        <div class="user-avatar"><i class="fa-solid fa-user-astronaut"></i></div>
        <div class="user-info">
            <h3 id="userName">Welcome, Client</h3>
            <p id="userStatus">Verified Account <i class="fa-solid fa-circle-check" style="color: #10b981;"></i></p>
        </div>
    </div>

    <div id="products-container"></div>

    <a href="https://t.me/sjwde" target="_blank" class="support-link"><i class="fa-solid fa-headset"></i> <span id="suppText">For support @sjwde</span></a>

    <div class="cart-panel">
        <div class="cart-summary">
            <div>
                <div class="total-label" id="totLabel">الإجمالي (Total)</div>
                <div class="total-price" id="totalPrice">0.00$</div>
            </div>
            <div style="text-align: left;">
                <div class="discount-badge" id="discountBadge"><i class="fa-solid fa-tags"></i> تم تطبيق الخصم</div>
            </div>
        </div>
        <button class="checkout-btn" id="checkoutBtn" onclick="checkout()">إتمام الطلب المكتمل</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        // جلب بيانات المستخدم الحقيقية من تيليجرام
        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('userName').innerText = user.first_name + (user.last_name ? ' ' + user.last_name : '');
        }

        let isArabic = true;
        let cart = { iphone: 0, ipad: 0, android: 0, snapchat: 0 };
        
        const prices = { iphone: 6.0, ipad: 4.0, android: 4.5, snapchat: 3.5 };
        const minPrices = { iphone: 4.5, ipad: 3.0, android: 3.0, snapchat: 2.5 };
        
        const items = [
            { id: "iphone", icon: "fa-apple", nameAr: "iPhone Plus", nameEn: "iPhone Plus" },
            { id: "ipad", icon: "fa-tablet-screen-button", nameAr: "iPad Plus", nameEn: "iPad Plus" },
            { id: "android", icon: "fa-android", nameAr: "Android Plus", nameEn: "Android Plus" },
            { id: "snapchat", icon: "fa-ghost", nameAr: "Snapchat Plus", nameEn: "Snapchat Plus" }
        ];

        const t = {
            ar: { price: "السعر:", curr: "$", btn: "إتمام الطلب عبر البوت", supp: "للدعم الفني والتواصل @sjwde", disc: "تم تطبيق خصم تلقائي" },
            en: { price: "Price:", curr: "$", btn: "Checkout via Bot", supp: "For support @sjwde", disc: "Auto-discount applied" }
        };

        function renderProducts() {
            const container = document.getElementById('products-container');
            container.innerHTML = '';
            
            items.forEach(item => {
                const name = isArabic ? item.nameAr : item.nameEn;
                const priceTxt = isArabic ? t.ar.price : t.en.price;
                
                container.innerHTML += `
                    <div class="product-card">
                        <div class="prod-details">
                            <h2><i class="fa-brands ${item.icon}" style="color: var(--accent); margin-left:5px;"></i> ${name}</h2>
                            <p>${priceTxt} ${prices[item.id]}${t.ar.curr}</p>
                        </div>
                        <div class="controls">
                            <button class="btn-ctrl minus" onclick="updateQty('${item.id}', -1)"><i class="fa-solid fa-minus"></i></button>
                            <span class="qty" id="qty-${item.id}">${cart[item.id]}</span>
                            <button class="btn-ctrl" onclick="updateQty('${item.id}', 1)"><i class="fa-solid fa-plus"></i></button>
                        </div>
                    </div>
                `;
            });
        }

        function toggleLang() {
            isArabic = !isArabic;
            document.documentElement.dir = isArabic ? 'rtl' : 'ltr';
            document.getElementById('langBtn').innerText = isArabic ? "English" : "عربي";
            document.getElementById('checkoutBtn').innerText = isArabic ? t.ar.btn : t.en.btn;
            document.getElementById('suppText').innerText = isArabic ? t.ar.supp : t.en.supp;
            document.getElementById('discountBadge').innerHTML = `<i class="fa-solid fa-tags"></i> ${isArabic ? t.ar.disc : t.en.disc}`;
            renderProducts();
        }

        function updateQty(id, change) {
            if (cart[id] + change >= 0) {
                cart[id] += change;
                document.getElementById(`qty-${id}`).innerText = cart[id];
                calculateTotal();
            }
        }

        function calculateTotal() {
            let totalQty = Object.values(cart).reduce((a, b) => a + b, 0);
            let discountPercent = 0;

            if (totalQty >= 10) discountPercent = 0.25;
            else if (totalQty >= 5) discountPercent = 0.10;

            let finalTotal = 0;
            for (let id in cart) {
                if (cart[id] > 0) {
                    let calcPrice = prices[id] * (1 - discountPercent);
                    if (calcPrice < minPrices[id]) calcPrice = minPrices[id];
                    finalTotal += (calcPrice * cart[id]);
                }
            }

            document.getElementById('totalPrice').innerText = finalTotal.toFixed(2) + t.ar.curr;
            
            const btn = document.getElementById('checkoutBtn');
            const badge = document.getElementById('discountBadge');

            if (totalQty > 0) {
                btn.classList.add('active');
                if(discountPercent > 0) badge.style.display = 'inline-block';
                else badge.style.display = 'none';
            } else {
                btn.classList.remove('active');
                badge.style.display = 'none';
            }
        }

        function checkout() {
            let totalQty = Object.values(cart).reduce((a, b) => a + b, 0);
            if (totalQty === 0) return;
            tg.sendData(JSON.stringify({ cart: cart }));
        }

        renderProducts();
    </script>
</body>
</html>
